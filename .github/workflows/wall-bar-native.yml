name: Wall bar FreeCAD native proof
on:
  pull_request:
    branches: [main]
    paths:
      - 'carpinova_agent/wall_bar.py'
      - 'carpinova_agent/drawer_modules.py'
      - 'carpinova_agent/cad_exchange.py'
      - 'carpinova_agent/wall_bar_sheets.py'
      - 'carpinova_agent/wall_bar_delivery.py'
      - 'carpinova_agent/drawing_sheet.py'
      - 'carpinova_agent/pilot_cli.py'
      - 'tests/test_drawing_sheet.py'
      - 'examples/wall-bar-900-review.json'
      - 'tests/test_wall_bar.py'
      - '.github/workflows/wall-bar-native.yml'
permissions:
  contents: read
jobs:
  native-wall-bar:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused geometry and negative tests
        run: python -m unittest tests.test_wall_bar -v
      - name: Generate verified canonical 21-panel CADExchange and schedule
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          from xml.etree import ElementTree
          from carpinova_agent.wall_bar import design_wall_bar
          from carpinova_agent.cad_exchange import cad_exchange,validate_exchange
          from carpinova_agent.wall_bar_sheets import (part_schedule_csv,part_schedule_svg,
                                                        wall_bar_orientation_svg,wall_bar_front_contacts_svg,wall_bar_isometric_svg)
          from carpinova_agent.wall_bar_delivery import review_files
          spec=json.loads(Path("examples/wall-bar-900-review.json").read_text())["module_spec"]
          model=design_wall_bar(spec)
          cad=validate_exchange(cad_exchange(model))
          assert cad["bounds_xyz_mm"]==[900,900,460] and len(cad["boxes"])==21
          assert len({b["piece_id"] for b in cad["boxes"]})==21
          assert sum(b["role"]=="drawer_facade" for b in cad["boxes"])==3
          assert not any(b["role"]=="drawer_front_wall" for b in cad["boxes"])
          assert all(b["origin_xyz_mm"][0]>=600 or b["origin_xyz_mm"][1]>=885 for b in cad["boxes"])
          assert all(model[k] is False for k in ("fabrication_ready","cutting_ready","drilling_ready","purchase_ready"))
          svg=part_schedule_svg(model);ElementTree.fromstring(svg)
          orientation=wall_bar_orientation_svg(model);ElementTree.fromstring(orientation)
          joint_drawing=wall_bar_front_contacts_svg(model);ElementTree.fromstring(joint_drawing)
          isometric=wall_bar_isometric_svg(model);ElementTree.fromstring(isometric)
          assert model["wall_bar_review"]["drawer_opening_face"]=="long_side_front"
          assert all(b["origin_xyz_mm"][2]==0 for b in cad["boxes"] if b["role"]=="drawer_facade")
          out=Path(os.environ["RUNNER_TEMP"])
          (out/"wall-bar-cad.json").write_text(json.dumps(cad,indent=2)+"\n")
          (out/"wall-bar-parts.csv").write_text(part_schedule_csv(model))
          (out/"wall-bar-parts.svg").write_text(svg)
          (out/"wall-bar-A-orientation.svg").write_text(orientation)
          (out/"wall-bar-front-contacts.svg").write_text(joint_drawing)
          (out/"wall-bar-A-isometric.svg").write_text(isometric)
          for name, body in review_files(model).items():
            (out/name).write_text(body, encoding="utf-8")
          print("WALL_BAR_CAD_MATCH",cad["geometry_sha256"])
          PY
      - name: Produce and verify inspectable seven-page review PDF
        run: |
          python -m pip install --disable-pip-version-check resvg_py==0.5.0 Pillow==13.0.0 pypdf==5.7.0
          python - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          from pypdf import PdfReader
          from carpinova_agent.pilot_cli import write_pilot_bundle,verify_pilot_bundle
          from carpinova_agent.drawing_sheet import create_render_bundle
          root=Path(os.environ["RUNNER_TEMP"])
          source=json.loads(Path("examples/wall-bar-900-review.json").read_text())
          folder=root/"CN-BAR-001-REVISION"
          original=write_pilot_bundle(source,folder)
          pdf_manifest=create_render_bundle(folder)
          checked=verify_pilot_bundle(folder)
          path=folder/"lamina"/"CN-BAR-001-planos-REVISION.pdf"
          data=path.read_bytes()
          assert len(PdfReader(path).pages)==7
          assert hashlib.sha256(data).hexdigest()==pdf_manifest["booklet_pdf_sha256"]
          assert original["geometry_sha256"]==pdf_manifest["geometry_sha256"]==checked["geometry_sha256"]
          assert original["piece_count"]==pdf_manifest["piece_count"]==21
          assert all(pdf_manifest[f] is False for f in
            ("fabrication_ready","cutting_ready","drilling_ready","purchase_ready"))
          print("WALL_BAR_PDF_SEVEN_PAGES_PASS",pdf_manifest["geometry_sha256"])
          PY
      - name: Install FreeCAD only on ephemeral CI runner
        run: |
          while IFS= read -r -d '' aptfile; do
            if grep -q 'packages.microsoft.com' "$aptfile"; then
              sudo mv "$aptfile" "$aptfile.disabled"
            fi
          done < <(find /etc/apt/sources.list.d -type f \( -name '*.list' -o -name '*.sources' \) -print0)
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends freecad-python3
          command -v freecadcmd || command -v FreeCADCmd
      - name: Generate and independently measure native FreeCAD solids
        env:
          CARPINOVA_CAD_INPUT: ${{ runner.temp }}/wall-bar-cad.json
          CARPINOVA_FCSTD_OUTPUT: ${{ runner.temp }}/wall-bar-native.FCStd
        run: |
          FC_BIN="$(command -v freecadcmd || command -v FreeCADCmd)"
          timeout 90s "$FC_BIN" integrations/freecad_headless_proof.FCScript 2>&1 | tee "$RUNNER_TEMP/wall-bar-native.log"
          test -s "$RUNNER_TEMP/wall-bar-native.FCStd"
          grep -q 'FREECAD_NATIVE_RESULT=' "$RUNNER_TEMP/wall-bar-native.log"
          grep -q 'NATIVE_GEOMETRY_MATCH' "$RUNNER_TEMP/wall-bar-native.log"
      - name: Confirm real FCStd archive has exactly 21 solids
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile
          from xml.etree import ElementTree
          p=Path(os.environ["RUNNER_TEMP"])/"wall-bar-native.FCStd"
          with ZipFile(p) as archive:
              assert archive.testzip() is None
              assert "Document.xml" in archive.namelist()
              root=ElementTree.fromstring(archive.read("Document.xml"))
              # FreeCAD stores each feature twice: once under Objects and once under ObjectData.
              objects=root.findall("./Objects/Object")
              print("FCSTD_DECLARED_FEATURES=",len(objects))
              assert len(objects)==21, f"Expected 21 actual features, got {len(objects)}"
          print("WALL_BAR_NATIVE_21_PANELS_PASS")
          PY
      - name: Preserve CAD and FreeCAD project for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wall-bar-21-piece-freecad-preview
          retention-days: 14
          path: |
            ${{ runner.temp }}/wall-bar-cad.json
            ${{ runner.temp }}/wall-bar-parts.csv
            ${{ runner.temp }}/wall-bar-parts.svg
            ${{ runner.temp }}/wall-bar-A-orientation.svg
            ${{ runner.temp }}/wall-bar-front-contacts.svg
            ${{ runner.temp }}/wall-bar-A-isometric.svg
            ${{ runner.temp }}/CN-BAR-001-referencias.csv
            ${{ runner.temp }}/CN-BAR-001-cajon-A.svg
            ${{ runner.temp }}/CN-BAR-001-cajon-B.svg
            ${{ runner.temp }}/CN-BAR-001-cajon-C.svg
            ${{ runner.temp }}/CN-BAR-001-guia-de-armado-REVISION.md
            ${{ runner.temp }}/wall-bar-native.FCStd
            ${{ runner.temp }}/wall-bar-native.log
            ${{ runner.temp }}/CN-BAR-001-REVISION/lamina/CN-BAR-001-planos-REVISION.pdf
            ${{ runner.temp }}/CN-BAR-001-REVISION/lamina/render-manifest.json
