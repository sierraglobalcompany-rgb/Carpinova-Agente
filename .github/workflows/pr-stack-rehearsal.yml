name: CarpiNova F1-F7D MCP full PR stack rehearsal

on:
  push:
    branches: ["feat/f7c-drawer-box-integration", "feat/connect-carpinova-mcp-stdio"]
  pull_request:
    branches: ["feat/f7c-door-fronts-geometric-review", "feat/f7d-natural-request-review"]

permissions:
  contents: read

jobs:
  rehearsal:
    name: Non-pushing clean merge rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact feature HEAD and ancestors
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rehearse all upstream PRs, including F7D/MCP on its head, without pushing
        shell: bash
        env:
          ROOT_SHA: 0bdb386a4875eaf2d1dcab99301348ae4bce7657
          F1_SHA: 23edbd38ac229df0d4f78bcf831bc9712d4a9c3a
          F2_SHA: 2e4da03488640d15576e3fb3452745181c8ac368
          F3_SHA: 1a2476d521decaf30ffcea48681cb4028a30ffbd
          F4_SHA: c2e1f330c750d4a3b20d2d0e1eb13f669d971cd3
          F5_SHA: dc64e51f832b524f7c34a78b42e176aebebbe8df
          F6_SHA: dad160f0a4df28b351dfb8431491edd572676d7a
          F7_SHA: 8a376c2298acb1ac2480454b363c6a754e096ec9
          F7C_BACK_SHA: de250308cb817390035798baa198cafa3e76d7f4
          F7C_FRONT_SHA: 8b8d9193491e23d2ef94663962d7e55202ba3bd7
          F7C_DRAWER_SHA: 4bb9a1e9ff0555b54984bea0695a6d5f574e89af
          F7D_SHA: d8240602874bbf336447a3a0670173c2f9f075a4
          FULL_MCP_STACK: ${{ github.ref_name == 'feat/connect-carpinova-mcp-stdio' || github.head_ref == 'feat/connect-carpinova-mcp-stdio' }}
          FEATURE_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stack-audit"
          git config user.name "CarpiNova Rehearsal"
          git config user.email "no-reply@localhost"
          for sha in "$ROOT_SHA" "$F1_SHA" "$F2_SHA" "$F3_SHA" "$F4_SHA" "$F5_SHA" "$F6_SHA" "$F7_SHA" "$F7C_BACK_SHA" "$F7C_FRONT_SHA" "$F7C_DRAWER_SHA" "$F7D_SHA" "$FEATURE_HEAD"; do
            git fetch --no-tags --quiet origin "$sha"
            git cat-file -e "$sha^{commit}"
          done
          git show "$FEATURE_HEAD:scripts/reconcile_stack_readme.py" > "$RUNNER_TEMP/stack-audit/reconcile.py"
          # Fail on stale upstream branch refs or changes to protected main.
          # A stale pinned SHA can otherwise pass without testing today's PR stack.
          git ls-remote --heads origin > "$RUNNER_TEMP/stack-audit/remote-heads.txt"
          for item in "main:$ROOT_SHA" \
            "feat/f1-parametric-cabinet-drawer:$F1_SHA" \
            "feat/f2-knowledge-bundle-reader:$F2_SHA" \
            "feat/f3-guided-intake-and-sketch:$F3_SHA" \
            "feat/f4-manufacturer-backed-hardware:$F4_SHA" \
            "feat/f5-integrated-tool-orchestrator:$F5_SHA" \
            "feat/f6-modular-carcase-and-finishes:$F6_SHA" \
            "feat/f7-construction-knowledge-cad-contract:$F7_SHA" \
            "feat/f7c-inset-backs-service-access:$F7C_BACK_SHA" \
            "feat/f7c-door-fronts-geometric-review:$F7C_FRONT_SHA"; do
            name="${item%%:*}"
            expected="${item#*:}"
            actual="$(awk -v ref="refs/heads/$name" '$2 == ref {print $1}' "$RUNNER_TEMP/stack-audit/remote-heads.txt")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Upstream $name changed (expected $expected; actual $actual)"
              exit 4
            fi
          done
          if [ "$FULL_MCP_STACK" = "true" ]; then
            expected="$F7D_SHA"
            actual="$(awk '$2 == "refs/heads/feat/f7d-natural-request-review" {print $1}' "$RUNNER_TEMP/stack-audit/remote-heads.txt")"
            if [ "$actual" != "$expected" ]; then
              echo "::error::F7D upstream changed; new integration audit required"
              exit 4
            fi
          fi
          echo "UPSTREAM_PINNED_HEADS_VERIFIED=YES"
          git checkout --detach "$ROOT_SHA"
          # Independent PRs are merged only after their parent chains:
          # F1 -> F3, F2, F4, F5, F6, F7, backs, fronts, drawers.
          # No protected ref is updated.
          DRAWER_HEAD="$FEATURE_HEAD"
          if [ "$FULL_MCP_STACK" = "true" ]; then
            DRAWER_HEAD="$F7C_DRAWER_SHA"
          fi
          for item in "F1:$F1_SHA" "F3:$F3_SHA" "F2:$F2_SHA" "F4:$F4_SHA" "F5:$F5_SHA" "F6:$F6_SHA" "F7:$F7_SHA" "F7C_BACK:$F7C_BACK_SHA" "F7C_FRONT:$F7C_FRONT_SHA" "F7C_DRAWER:$DRAWER_HEAD"; do
            label="${item%%:*}"
            sha="${item#*:}"
            if ! git merge --no-ff --no-edit -m "REHEARSAL only: $label" "$sha"; then
              git diff --name-only --diff-filter=U | sort > "$RUNNER_TEMP/stack-audit/conflict.txt"
              if [ "$label" != "F5" ] || [ "$(cat "$RUNNER_TEMP/stack-audit/conflict.txt")" != "README.md" ]; then
                echo "::error::Unexpected conflict at $label; no merge permitted."
                git status --short
                exit 2
              fi
              git show "$F4_SHA:README.md" > "$RUNNER_TEMP/stack-audit/f4-readme.md"
              git show "$F5_SHA:README.md" > "$RUNNER_TEMP/stack-audit/f5-readme.md"
              git show "$FEATURE_HEAD:README.md" > "$RUNNER_TEMP/stack-audit/f7-readme.md"
              python "$RUNNER_TEMP/stack-audit/reconcile.py" \
                --f4 "$RUNNER_TEMP/stack-audit/f4-readme.md" \
                --f5 "$RUNNER_TEMP/stack-audit/f5-readme.md" \
                --f7 "$RUNNER_TEMP/stack-audit/f7-readme.md" \
                --output README.md
              git add README.md
              git commit -m "REHEARSAL ONLY: preserve exact F4 and F5 README paragraphs"
              echo "README_RESOLUTION_OWNER_REVIEW_REQUIRED=YES" > "$RUNNER_TEMP/stack-audit/reconciliation.txt"
            fi
            printf '%s %s\n' "$label" "$(git rev-parse HEAD)" | tee -a "$RUNNER_TEMP/stack-audit/local-commits.txt"
          done
          if [ "$FULL_MCP_STACK" = "true" ]; then
            for item in "F7D:$F7D_SHA" "MCP:$FEATURE_HEAD"; do
              label="${item%%:*}"
              sha="${item#*:}"
              # Only the already-known F5 README conflict has a safe,
              # source-based reconciliation. Any other conflict is a blocker.
              git merge --no-ff --no-edit -m "REHEARSAL only: $label" "$sha"
              printf '%s %s\n' "$label" "$(git rev-parse HEAD)" | tee -a "$RUNNER_TEMP/stack-audit/local-commits.txt"
            done
          fi
          git diff --name-status "$FEATURE_HEAD" HEAD > "$RUNNER_TEMP/stack-audit/tree-difference.txt"
          if [ -s "$RUNNER_TEMP/stack-audit/tree-difference.txt" ]; then
            echo "::error::Integrated tree differs from exact feature HEAD; review differences."
            cat "$RUNNER_TEMP/stack-audit/tree-difference.txt"
            exit 3
          fi
          echo "KNOWN_F5_README_CONFLICT=RESOLVED_ONLY_IN_LOCAL_REHEARSAL"
          echo "STACK_TREE_EQUAL_TO_FEATURE_HEAD=YES"
          echo "PROTECTED_MAIN_UNTOUCHED=YES"
          printf '%s\n' "$FEATURE_HEAD" > "$RUNNER_TEMP/stack-audit/expected-head.txt"
      - name: Test exact rehearsed integration tree
        run: python -m unittest discover -s tests -q
      - name: Archive merge rehearsal audit (success or failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carpinova-full-pr-stack-rehearsal
          retention-days: 14
          path: ${{ runner.temp }}/stack-audit/
