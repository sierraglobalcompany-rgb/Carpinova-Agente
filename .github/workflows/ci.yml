name: Python geometry checks
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q carpinova_agent tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke CLI (does not authorize fabrication)
        run: |
          python -m carpinova_agent --input examples/cabinet.json > /tmp/cabinet.json
          python -m carpinova_agent --input examples/drawer.json > /tmp/drawer.json
          python - <<'PY'
          import json
          for name in ("cabinet", "drawer"):
              payload = json.load(open(f"/tmp/{name}.json"))
              assert payload["status"] == "DRAFT_NOT_FOR_CUTTING"
              assert payload["release_blockers"]
          PY
      - name: Guided interview and SVG smoke
        run: |
          python -m carpinova_agent.guide_cli --input examples/intake-cabinet-partial.json > /tmp/intake-questions.json
          python -m carpinova_agent.guide_cli --input examples/intake-cabinet-draft.json --output /tmp/intake-design.json --sketch /tmp/carpi-draft.svg
          python -m carpinova_agent.guide_cli --input examples/intake-closet.json > /tmp/closet.json
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree
          partial = json.loads(Path("/tmp/intake-questions.json").read_text())
          draft = json.loads(Path("/tmp/intake-design.json").read_text())
          closet = json.loads(Path("/tmp/closet.json").read_text())
          assert partial["phase"] == "NEEDS_INPUT" and partial["design"] is None
          assert draft["phase"] == "GEOMETRY_DRAFT"
          assert draft["design"]["status"] == "DRAFT_NOT_FOR_CUTTING"
          assert closet["phase"] == "CONCEPT_ONLY" and closet["design"] is None
          ElementTree.parse("/tmp/carpi-draft.svg")
          PY
