name: CarpiNova Maestro F5 integration
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  integrated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all components
        run: python -m compileall -q carpinova_agent knowledge_client hardware tests
      - name: Full local suite F1-F5
        run: python -m unittest discover -s tests -v
      - name: Maestro CLI preliminary project
        run: |
          python -m carpinova_agent.maestro_cli --input examples/maestro-questions.json > /tmp/questions.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/questions.json").read_text())
          assert data["status"] == "NEEDS_INPUT"
          assert data["project"]["design"] is None
          assert data["fabrication_ready"] is False
          PY
      - name: F6 module composition smoke (no cutting authority)
        run: |
          python -m carpinova_agent.modular_cli --input examples/modular-closet.json --svg /tmp/modular.svg --csv /tmp/modular.csv > /tmp/modular-closet.json
          python -m carpinova_agent.modular_cli --input examples/modular-kitchen.json > /tmp/modular-kitchen.json
          python -m carpinova_agent.maestro_cli --input examples/maestro-modular.json --sketch /tmp/maestro-modular.svg --csv /tmp/maestro-modular.csv > /tmp/maestro-modular.json
          python - <<'PY'
          import json
          from pathlib import Path
          closet = json.loads(Path("/tmp/modular-closet.json").read_text())
          kitchen = json.loads(Path("/tmp/modular-kitchen.json").read_text())
          maestro = json.loads(Path("/tmp/maestro-modular.json").read_text())
          assert closet["piece_count"] == 8
          assert closet["total_module_width_mm"] == 2000
          assert closet["modules"][0]["clear_width_mm"] == 914
          assert kitchen["piece_count"] == 8
          assert all(p["finished_cut_dimensions_mm"] is None for p in closet["parts"])
          assert maestro["status"] == "DRAFT_NOT_FOR_CUTTING"
          assert maestro["modular"]["total_module_width_mm"] == 1200
          assert maestro["fabrication_ready"] is False
          assert maestro["cutting_ready"] is False
          assert maestro["drilling_ready"] is False
          import csv
          from xml.etree import ElementTree
          ElementTree.parse("/tmp/modular.svg")
          ElementTree.parse("/tmp/maestro-modular.svg")
          with Path("/tmp/modular.csv").open(newline="", encoding="utf-8") as source:
              rows = list(csv.DictReader(source))
          assert len(rows) == 8
          assert all(row["production_status"] == "BORRADOR_NO_CORTAR" for row in rows)
          with Path("/tmp/maestro-modular.csv").open(newline="", encoding="utf-8") as source:
              assert len(list(csv.DictReader(source))) == 8
          PY
      - name: Hardware remains blocked
        run: |
          python -m carpinova_agent.maestro_cli --input examples/maestro-combined.json > /tmp/should_not_succeed 2>/tmp/expected_error && exit 1 || test $? -eq 2
          grep -q "bundle Knowledge" /tmp/expected_error

  source-backed-full-book:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout agent exact PR branch
        uses: actions/checkout@v4
      - name: Checkout pinned canonical Knowledge source
        uses: actions/checkout@v4
        with:
          repository: sierraglobalcompany-rgb/CarpiNova-Knowledge
          ref: 4df02ef54562fac5a820cbad92b0edee547c310b
          path: knowledge-src
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Validate canonical Knowledge repo
        run: uv run --project knowledge-src python -m carpinova_knowledge validate --root knowledge-src > /tmp/knowledge-qa.json
      - name: Generate deterministic full-book 1.2.0 bundle
        run: |
          uv run --project knowledge-src python -m carpinova_knowledge build-book-dist --root knowledge-src --book-id cpnc-2025 --out "$RUNNER_TEMP/knowledge-1.2.0" > /tmp/book-build-manifest.json
      - name: Verify full-book retrieval and integrated furniture request
        run: |
          python -m carpinova_agent.maestro_cli --input examples/maestro-combined.json --bundle-dir "$RUNNER_TEMP/knowledge-1.2.0" --output /tmp/maestro-full.json --sketch /tmp/cabinet-draft.svg
          python -m carpinova_agent.maestro_cli --question "bisagras" --bundle-dir "$RUNNER_TEMP/knowledge-1.2.0" --output /tmp/maestro-reference.json
          python - <<'PY'
          import json
          from pathlib import Path
          from xml.etree import ElementTree
          from knowledge_client import load_bundle
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "knowledge-1.2.0"
          knowledge = load_bundle(root)
          assert knowledge["coverage"] == "FULL_BOOK"
          assert knowledge["manifest"]["counts"]["pages"] == 252
          assert knowledge["manifest"]["source_page_count"] == 295
          combined = json.loads(Path("/tmp/maestro-full.json").read_text())
          reference = json.loads(Path("/tmp/maestro-reference.json").read_text())
          assert combined["status"] == "DRAFT_NOT_FOR_CUTTING"
          assert combined["project"]["design"]["dimensions"]["clear_width_mm"] == 564
          assert combined["hardware"]["candidate_hinge_sku"] == "71B3550"
          assert combined["hardware"]["drilling_coordinates"] == []
          assert combined["knowledge"]["coverage"] == "FULL_BOOK"
          assert combined["knowledge"]["total_matches"] > 0
          assert len(combined["source_provenance"]) > 0
          assert all(x["fabrication_authority"] is False for x in combined["source_provenance"])
          assert reference["status"] == "REFERENCE_ONLY"
          assert reference["knowledge"]["total_matches"] > 0
          assert combined["fabrication_ready"] is False
          assert combined["purchase_ready"] is False
          ElementTree.parse("/tmp/cabinet-draft.svg")
          print("FULL_BOOK_1_2_0=PASS; MAESTRO_COMBINED=PASS; FABRICATION_RELEASED=NO")
          PY
